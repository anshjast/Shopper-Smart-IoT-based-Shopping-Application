name: shopper
description: "Shopping App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase/Core Packages
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.6
  firebase_auth: ^5.5.2
  google_fonts: ^6.1.0
  http: ^1.0.0
  qr_flutter: ^4.0.0

  # Payment (Keep)
  easy_upi_payment: ^0.1.6
  cupertino_icons: ^1.0.8

  # ❌ REMOVED: barcode_scan2 (Replaced by AI)

  # 💡 AI (TFLite) & Camera Packages
  camera: ^0.10.0
  tflite_flutter: ^0.12.1
  image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # ⚠️ CRITICAL: ADD YOUR AI ASSETS HERE
  assets:
    - assets/images/gpay.png
    - assets/images/phonepe.png
    - assets/images/paytm.png
    - assets/shopper_model.tflite
    - assets/labels.txt